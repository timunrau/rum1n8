name: Unit Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build and verify web/TWA launch metadata
        run: npm run build
        env:
          VITE_APP_URL: https://rum1n8.unrau.xyz/app/
          VITE_MARKETING_URL: https://marketing.example/
          VITE_UMAMI_SCRIPT_URL: https://analytics.example/script.js
          VITE_UMAMI_WEBSITE_ID: app-test-id
          VITE_UMAMI_MARKETING_WEBSITE_ID: marketing-test-id
