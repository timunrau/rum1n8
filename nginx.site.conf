map $request_uri $rum1n8_marketing_canonical_path {
    default "";
    ~^/index\.html(?:\?|$) /;
    ~^/home(?:/|/index\.html)?(?:\?|$) /;
    ~^/about(?:/|/index\.html)?(?:\?|$) /;
    ~^/memorization-is-a-spiritual-life-hack(?:/index\.html)?(?:\?|$) /memorization-is-a-spiritual-life-hack/;
    ~^/tips-for-memorizing-scripture(?:/index\.html)?(?:\?|$) /tips-for-memorizing-scripture/;
    ~^/import/biblememory(?:/index\.html)?(?:\?|$) /import/biblememory/;
    ~^/privacy(?:\.html|/index\.html)?(?:\?|$) /privacy/;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    if ($rum1n8_marketing_canonical_path != "") {
        return 301 $rum1n8_marketing_canonical_path$is_args$args;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /health {
        access_log off;
        default_type text/plain;
        try_files /health =404;
        add_header Cache-Control "no-store" always;
    }

    location ~* ^/assets/.*\.(?:js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
